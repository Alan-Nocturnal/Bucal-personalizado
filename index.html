<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Personalizador Bucal 3D</title>
  <!-- Motores Three.js y Controles -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
    
    #canvas-container {
      width: 100vw;
      height: 50vh;
      background: radial-gradient(circle, #2a2a2a 0%, #050505 100%);
      touch-action: none;
    }
    
    .controls {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-group {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .control-group label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }

    input[type="color"] {
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }

    input[type="file"] { display: none; }
    .file-label {
      display: block;
      background: #333;
      color: #fff;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px dashed #555;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="controls">
    <div class="control-group">
      <label>Colores del Bucal 3D</label>
      <div class="row">
        <span>Exterior (Frontal)</span>
        <input type="color" id="outerColor" value="#cc0000">
      </div>
      <div class="row" style="margin-top: 8px;">
        <span>Interior (Goma/Encía)</span>
        <input type="color" id="innerColor" value="#ffffff">
      </div>
    </div>

    <div class="control-group">
      <label>Logo / Estampa Frontal</label>
      <label for="logoLoader" class="file-label">📁 Cargar Imagen desde Celular</label>
      <input type="file" id="logoLoader" accept="image/*">
    </div>

    <button class="btn" onclick="resetView()">🔄 Restablecer Vista 3D</button>
  </div>

  <script>
    // 1. Configuración de Escena 3D
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 5, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Controles de Rotación Táctil / Mouse
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // 2. Construcción Geométrica Anatómica del Bucal 3D
    const mouthguardGroup = new THREE.Group();

    // Curva en forma de U de la dentadura
    const arcShape = new THREE.Shape();
    arcShape.absarc(0, 0, 3.5, 0.2, Math.PI - 0.2, false);

    // Materiales 3D
    const outerMaterial = new THREE.MeshStandardMaterial({
      color: 0xcc0000,
      roughness: 0.2,
      metalness: 0.1
    });

    const innerMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.4,
      metalness: 0.0
    });

    // Geometría Exterior (Frontal)
    const extrudeSettingsOuter = { depth: 1.8, bevelEnabled: true, bevelSegments: 5, steps: 2, bevelSize: 0.4, bevelThickness: 0.4 };
    const outerGeo = new THREE.ExtrudeGeometry(arcShape, extrudeSettingsOuter);
    const outerMesh = new THREE.Mesh(outerGeo, outerMaterial);
    outerMesh.rotation.x = -Math.PI / 2;
    outerMesh.position.y = -0.9;
    mouthguardGroup.add(outerMesh);

    // Geometría Interior (Encía/Cavidad)
    const innerArcShape = new THREE.Shape();
    innerArcShape.absarc(0, 0, 3.1, 0.3, Math.PI - 0.3, false);
    const extrudeSettingsInner = { depth: 1.6, bevelEnabled: true, bevelSegments: 3, steps: 2, bevelSize: 0.2, bevelThickness: 0.2 };
    const innerGeo = new THREE.ExtrudeGeometry(innerArcShape, extrudeSettingsInner);
    const innerMesh = new THREE.Mesh(innerGeo, innerMaterial);
    innerMesh.rotation.x = -Math.PI / 2;
    innerMesh.position.y = -0.7;
    mouthguardGroup.add(innerMesh);

    scene.add(mouthguardGroup);

    // 3. Plano para Logo / Estampa Frontal
    let logoMesh;
    document.getElementById('logoLoader').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const texture = new THREE.TextureLoader().load(event.target.result);
          
          if (!logoMesh) {
            const logoGeo = new THREE.PlaneGeometry(1.8, 1.8);
            const logoMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            logoMesh = new THREE.Mesh(logoGeo, logoMat);
            logoMesh.position.set(0, 0, 3.8); // Posicionado en el frente del bucal
            mouthguardGroup.add(logoMesh);
          } else {
            logoMesh.material.map = texture;
            logoMesh.material.needsUpdate = true;
          }
        };
        reader.readAsDataURL(file);
      }
    });

    // Eventos de Color
    document.getElementById('outerColor').addEventListener('input', (e) => {
      outerMaterial.color.set(e.target.value);
    });

    document.getElementById('innerColor').addEventListener('input', (e) => {
      innerMaterial.color.set(e.target.value);
    });

    function resetView() {
      camera.position.set(0, 5, 12);
      mouthguardGroup.rotation.set(0, 0, 0);
      controls.reset();
    }

    // Ajuste responsive para celulares
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Bucle de Renderizado
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
