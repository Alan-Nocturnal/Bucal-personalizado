<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Protector Bucal 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #080808; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 20px; }
    
    #viewport {
      width: 100vw;
      height: 55vh;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
      touch-action: none;
    }
    
    .panel {
      width: 100%;
      max-width: 380px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group {
      background: #141414;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
    }

    .group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .row-full { width: 100%; margin-top: 8px; }

    input[type="color"] {
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    input[type="range"] {
      width: 100%; accent-color: #e50914;
    }

    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      width: 100%;
      font-size: 0.9rem;
      transition: filter 0.2s;
    }
    .btn:hover { filter: brightness(1.1); }

    .btn-dark { background: #252525; color: #ddd; }
    .btn-copy { background: #16a34a; color: #fff; margin-top: 6px; }

    input[type="file"] { display: none; }
    .file-btn {
      display: block;
      background: #1f1f1f;
      color: #eee;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px dashed #444;
    }

    .copy-msg {
      font-size: 0.75rem;
      color: #86efac;
      margin-top: 6px;
      height: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .copy-msg.show { opacity: 1; }

    textarea { position: absolute; left: -9999px; }
  </style>
</head>
<body>

  <div id="viewport"></div>

  <div class="panel">
    <div class="group">
      <label>🎨 Colores</label>
      <div class="row">
        <span>Exterior</span>
        <input type="color" id="extColor" value="#00ff00">
      </div>
      <div class="row" style="margin-top: 8px;">
        <span>Interior / Canaleta</span>
        <input type="color" id="intColor" value="#000000">
      </div>
    </div>

    <div class="group">
      <label>🖼️ Logo Frontal</label>
      <label for="imgInput" class="file-btn">📁 Subir Imagen / Logo</label>
      <input type="file" id="imgInput" accept="image/*">

      <div class="row row-full">
        <span>Tamaño</span>
        <input type="range" id="logoScale" min="0.3" max="2.5" step="0.05" value="1">
      </div>
      <div class="row row-full">
        <span>Posición Horizontal</span>
        <input type="range" id="logoX" min="-2" max="2" step="0.05" value="0">
      </div>
      <div class="row row-full">
        <span>Posición Vertical</span>
        <input type="range" id="logoY" min="-1" max="1.5" step="0.05" value="0.5">
      </div>
    </div>

    <div class="row" style="margin-top: 6px;">
      <button class="btn btn-dark" onclick="setView('front')">👁️ Frente</button>
      <button class="btn btn-dark" onclick="setView('top')">👁️ Arriba</button>
      <button class="btn btn-dark" onclick="setView('iso')">👁️ Vista 3D</button>
    </div>

    <button class="btn" onclick="exportPNG()" style="margin-top: 10px;">💾 Guardar PNG</button>
    <button class="btn btn-copy" onclick="copyCode()">📋 Copiar Código Completo</button>
    <div id="copyMessage" class="copy-msg">✅ ¡Código copiado!</div>
  </div>

  <textarea id="fullCode"></textarea>

  <script>
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación
    scene.add(new THREE.DirectionalLight(0xffffff, 1.2).position.set(5, 8, 6));
    scene.add(new THREE.DirectionalLight(0xffffff, 0.5).position.set(-4, 5, -4));
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // Materiales
    const extMat = new THREE.MeshStandardMaterial({
      color: 0x00ff00, roughness: 0.35, metalness: 0.05
    });
    const intMat = new THREE.MeshStandardMaterial({
      color: 0x000000, roughness: 0.4, metalness: 0
    });

    const guardGroup = new THREE.Group();

    // =========================================================
    // PERFIL EN FORMA DE U — MIRA HACIA ARRIBA
    // =========================================================
    function makeUShape(scale = 1, inset = 0) {
      const s = new THREE.Shape();
      const w = 0.5 * scale;       // ancho total
      const h = 0.7 * scale;       // altura de paredes
      const t = 0.15 * scale;      // grosor de pared

      const off = inset;

      // Pared izquierda
      s.moveTo(-w - off, 0);
      s.lineTo(-w - off, h);
      s.lineTo(-w + t - off, h);
      s.lineTo(-w + t - off, t);
      
      // Piso
      s.lineTo(w - t + off, t);
      
      // Pared derecha
      s.lineTo(w - t + off, h);
      s.lineTo(w + off, h);
      s.lineTo(w + off, 0);
      
      s.closePath();
      return s;
    }

    // Curva de la arcada (vista desde arriba: forma de herradura)
    const arcPoints = [
      new THREE.Vector3(-2.2, 0, -0.9),
      new THREE.Vector3(-1.9, 0, 0.7),
      new THREE.Vector3(-1.0, 0, 1.4),
      new THREE.Vector3( 0.0, 0, 1.6),
      new THREE.Vector3( 1.0, 0, 1.4),
      new THREE.Vector3( 1.9, 0, 0.7),
      new THREE.Vector3( 2.2, 0, -0.9)
    ];
    const curve = new THREE.CatmullRomCurve3(arcPoints, false, 'catmullrom', 0.8);

    // EXTRUSIÓN CON ROTACIÓN CONTROLADA = la U siempre mira hacia arriba
    function extrudeGuard(shape, colorMat, rotOffset = 0) {
      const geo = new THREE.ExtrudeGeometry(shape, {
        steps: 120,
        bevelEnabled: true,
        bevelSize: 0.03,
        bevelThickness: 0.03,
        bevelSegments: 3,
        extrudePath: curve,
        extrudeRotate: 0 // ¡CLAVE! Evita que la U gire y se deforme
      });
      
      // Ajustar orientación para que la U mire hacia arriba
      geo.rotateX(-Math.PI / 2);
      if (rotOffset) geo.rotateZ(rotOffset);
      
      return new THREE.Mesh(geo, colorMat);
    }

    // Capa exterior
    const outerMesh = extrudeGuard(makeUShape(1.0, 0), extMat);
    guardGroup.add(outerMesh);

    // Capa interior (canaleta donde van los dientes — un poco más chica)
    const innerMesh = extrudeGuard(makeUShape(0.88, 0.02), intMat);
    guardGroup.add(innerMesh);

    scene.add(guardGroup);

    // =========================================================
    // LOGO
    // =========================================================
    let logoMesh = null;
    const logoPos = { s: 1, x: 0, y: 0.5, z: 2.0 };

    function updateLogo() {
      if (!logoMesh) return;
      logoMesh.scale.setScalar(logoPos.s);
      logoMesh.position.set(logoPos.x, logoPos.y, logoPos.z);
    }

    document.getElementById('imgInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const tex = new THREE.Texture(img);
        tex.needsUpdate = true;
        if (!logoMesh) {
          logoMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1.4, 0.7),
            new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
          );
          guardGroup.add(logoMesh);
        } else {
          logoMesh.material.map = tex;
          logoMesh.material.needsUpdate = true;
        }
        updateLogo();
        renderer.render(scene, camera);
      };
      img.src = URL.createObjectURL(file);
    });

    document.getElementById('logoScale').addEventListener('input', e => {
      logoPos.s = +e.target.value; updateLogo();
    });
    document.getElementById('logoX').addEventListener('input', e => {
      logoPos.x = +e.target.value; updateLogo();
    });
    document.getElementById('logoY').addEventListener('input', e => {
      logoPos.y = +e.target.value; updateLogo();
    });

    // =========================================================
    // CONTROLES
    // =========================================================
    document.getElementById('extColor').addEventListener('input', e => {
      extMat.color.set(e.target.value);
    });
    document.getElementById('intColor').addEventListener('input', e => {
      intMat.color.set(e.target.value);
    });

    function setView(type) {
      if (type === 'front') {
        camera.position.set(0, 1.0, 5.0);
      } else if (type === 'top') {
        camera.position.set(0, 4.5, 0.01);
      } else {
        camera.position.set(3.5, 2.8, 3.5);
      }
      controls.target.set(0, 0.25, 0);
      controls.update();
    }

    function exportPNG() {
      renderer.render(scene, camera);
      const a = document.createElement('a');
      a.download = 'protector-bucal.png';
      a.href = renderer.domElement.toDataURL('image/png');
      a.click();
    }

    function copyCode() {
      const code = document.documentElement.outerHTML;
      navigator.clipboard.writeText(code).then(() => {
        document.getElementById('copyMessage').classList.add('show');
        setTimeout(() => document.getElementById('copyMessage').classList.remove('show'), 2500);
      });
    }

    setView('iso');
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
