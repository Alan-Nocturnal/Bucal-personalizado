<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Configurador 3D — Protector Bucal</title>
  <!-- Librerías desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/DecalGeometry.js"></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --borde: #2a2a2a;
      --acento: #e50914;
      --texto: #f0f0f0;
      --texto-sec: #999;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--texto);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Visor 3D */
    #canvas-container {
      flex: 1;
      position: relative;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cargando {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2rem;
      color: var(--texto-sec);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--borde);
      border-top-color: var(--acento);
      border-radius: 50%;
      animation: girar 1s linear infinite;
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    /* Panel lateral */
    .panel {
      background: var(--panel);
      border-top: 1px solid var(--borde);
      padding: 1.2rem;
      max-height: 45vh;
      overflow-y: auto;
    }

    .panel h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #fff;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 0.5rem;
    }

    .grupo {
      margin-bottom: 1.2rem;
    }

    .fila {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.6rem 0;
      gap: 0.8rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--texto-sec);
      flex-shrink: 0;
    }

    input[type="color"] {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--acento);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-primario {
      background: var(--acento);
      color: white;
      margin-bottom: 0.6rem;
    }

    .btn-primario:hover { filter: brightness(1.1); }

    .btn-peligro {
      background: #2c1212;
      color: #ff6b6b;
      border: 1px solid #441a1a;
    }

    .btn-peligro:hover { background: #441a1a; }

    input[type="file"] { display: none; }

    .subir-label {
      display: block;
      background: #1f1f1f;
      text-align: center;
      padding: 0.9rem;
      border-radius: 8px;
      border: 1px dashed #444;
      cursor: pointer;
      margin-bottom: 0.6rem;
      font-size: 0.9rem;
    }

    .subir-label:hover { border-color: var(--acento); }

    .oculto { display: none !important; }
  </style>
</head>
<body>

  <!-- Visor 3D -->
  <div id="canvas-container">
    <div class="cargando" id="estado-carga">
      <div class="spinner"></div>
      <span>Cargando modelo...</span>
    </div>
  </div>

  <!-- Panel de controles -->
  <div class="panel">
    <h2>🎨 Colores</h2>

    <div class="grupo">
      <div class="fila">
        <label>Exterior</label>
        <input type="color" id="color-exterior" value="#ff0000" />
      </div>
      <div class="fila">
        <label>Interior / Canaleta</label>
        <input type="color" id="color-interior" value="#000000" />
      </div>
    </div>

    <h2>🖼️ Logo / Gráfico</h2>

    <label for="entrada-imagen" class="subir-label">📁 Subir imagen desde equipo</label>
    <input type="file" id="entrada-imagen" accept="image/*" />

    <div id="controles-logo" class="oculto">
      <div class="fila">
        <label>Mover horizontal</label>
        <input type="range" id="logo-x" min="-1.5" max="1.5" step="0.01" value="0" />
      </div>
      <div class="fila">
        <label>Mover vertical</label>
        <input type="range" id="logo-y" min="-1.5" max="1.5" step="0.01" value="0" />
      </div>
      <div class="fila">
        <label>Escala</label>
        <input type="range" id="logo-escala" min="0.3" max="3" step="0.05" value="1" />
      </div>
      <div class="fila">
        <label>Opacidad</label>
        <input type="range" id="logo-opacidad" min="0" max="1" step="0.05" value="1" />
      </div>
      <div class="fila">
        <label>Modo fusión</label>
        <select id="modo-fusion" style="background:#1f1f1f; color:#fff; border:none; padding:0.3rem; border-radius:4px;">
          <option value="normal">Normal</option>
          <option value="multiply">Multiplicar</option>
        </select>
      </div>

      <button class="btn btn-peligro" id="btn-quitar">🗑️ Quitar imagen</button>
    </div>
  </div>

  <script>
    // ==========================================================
    // CONFIGURACIÓN INICIAL Y ESCENA
    // ==========================================================
    const contenedor = document.getElementById('canvas-container');
    const estadoCarga = document.getElementById('estado-carga');

    // Escena
    const escena = new THREE.Scene();
    escena.background = new THREE.Color(0x0a0a0a);

    // Cámara
    const camara = new THREE.PerspectiveCamera(
      45,
      contenedor.clientWidth / contenedor.clientHeight,
      0.1,
      100
    );
    camara.position.set(0, 1.2, 4.5);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(contenedor.clientWidth, contenedor.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    contenedor.appendChild(renderer.domElement);

    // ==========================================================
    // CONTROLES DE CÁMARA RESTRINGIDOS
    // ==========================================================
    const controles = new THREE.OrbitControls(camara, renderer.domElement);
    controles.enableDamping = true;
    controles.dampingFactor = 0.05;
    controles.enablePan = false; // Sin desplazamiento lateral

    // Limites de visión
    controles.minAzimuthAngle = -Math.PI * 0.35;  // -63°
    controles.maxAzimuthAngle = Math.PI * 0.35;   // +63°
    controles.minPolarAngle = Math.PI * 0.25;      // No ver por debajo
    controles.maxPolarAngle = Math.PI * 0.65;      // No pasar de arriba

    controles.target.set(0, 0.2, 0);

    // ==========================================================
    // ILUMINACIÓN REALISTA (simula silicona/plástico)
    // ==========================================================
    const luzAmbiental = new THREE.AmbientLight(0xffffff, 0.55);
    escena.add(luzAmbiental);

    const luzPrincipal = new THREE.DirectionalLight(0xffffff, 1.3);
    luzPrincipal.position.set(3, 4, 5);
    escena.add(luzPrincipal);

    const luzRelleno = new THREE.DirectionalLight(0xfff4e5, 0.6);
    luzRelleno.position.set(-4, 3, 3);
    escena.add(luzRelleno);

    const luzBrillo = new THREE.DirectionalLight(0xffffff, 0.4);
    luzBrillo.position.set(0, 5, -3);
    escena.add(luzBrillo);

    // ==========================================================
    // VARIABLES GLOBALES
    // ==========================================================
    let modelo = null;
    let mallaExterior = null;
    let mallaInterior = null;
    let decal = null;
    let texturaLogo = null;

    // Materiales base
    const matExteriorBase = new THREE.MeshStandardMaterial({
      color: 0xff0000,
      roughness: 0.25,
      metalness: 0.05
    });

    const matInteriorBase = new THREE.MeshStandardMaterial({
      color: 0x000000,
      roughness: 0.4,
      metalness: 0
    });

    // ==========================================================
    // CARGA DEL MODELO DESDE bucal.glb
    // ==========================================================
    const cargadorGLTF = new THREE.GLTFLoader();

    cargadorGLTF.load(
      'bucal.glb',
      (gltf) => {
        modelo = gltf.scene;

        // Ajustar escala y posición según necesidad
        modelo.scale.set(1, 1, 1);
        modelo.position.set(0, 0, 0);

        // Identificar mallas por nombre
        modelo.traverse((hijo) => {
          if (!hijo.isMesh) return;

          if (hijo.material.name === 'Exterior' || hijo.name === 'Exterior') {
            mallaExterior = hijo;
            mallaExterior.material = matExteriorBase;
          }

          if (hijo.material.name === 'Interior' || hijo.name === 'Interior') {
            mallaInterior = hijo;
            mallaInterior.material = matInteriorBase;
          }
        });

        // Mensaje si no se encontraron los nombres
        if (!mallaExterior && !mallaInterior) {
          console.warn('⚠️ No se encontraron mallas con nombres "Exterior" / "Interior". Se aplican materiales a toda la malla.');
          modelo.traverse((hijo) => {
            if (!hijo.isMesh) return;
            hijo.material = matExteriorBase;
          });
        }

        escena.add(modelo);
        estadoCarga.remove();
      },
      (progreso) => {
        const porcentaje = Math.round((progreso.loaded / progreso.total) * 100);
        estadoCarga.querySelector('span').textContent = `Cargando modelo... ${porcentaje}%`;
      },
      (error) => {
        estadoCarga.querySelector('span').textContent = '❌ Error al cargar "bucal.glb"';
        console.error(error);
      }
    );

    // ==========================================================
    // CONTROLES DE COLOR
    // ==========================================================
    document.getElementById('color-exterior').addEventListener('input', (e) => {
      const color = new THREE.Color(e.target.value);
      matExteriorBase.color.set(color);
    });

    document.getElementById('color-interior').addEventListener('input', (e) => {
      const color = new THREE.Color(e.target.value);
      matInteriorBase.color.set(color);
    });

    // ==========================================================
    // GESTIÓN DE IMAGEN / LOGO — DecalGeometry
    // ==========================================================
    const entradaImagen = document.getElementById('entrada-imagen');
    const controlesLogo = document.getElementById('controles-logo');
    const btnQuitar = document.getElementById('btn-quitar');

    // Parámetros del logo
    const configLogo = {
      x: 0,
      y: 0,
      escala: 1,
      opacidad: 1,
      fusion: 'normal'
    };

    entradaImagen.addEventListener('change', (e) => {
      const archivo = e.target.files[0];
      if (!archivo) return;

      const lector = new FileReader();
      lector.onload = (evento) => {
        const img = new Image();
        img.onload = () => {
          // Crear textura
          if (texturaLogo) texturaLogo.dispose();
          texturaLogo = new THREE.Texture(img);
          texturaLogo.needsUpdate = true;

          controlesLogo.classList.remove('oculto');
          actualizarDecal();
        };
        img.src = evento.target.result;
      };
      lector.readAsDataURL(archivo);
    });

    // Actualizar decal con controles
    function actualizarDecal() {
      if (!mallaExterior || !texturaLogo) return;

      // Eliminar anterior
      if (decal) {
        escena.remove(decal);
        decal.material.map?.dispose();
        decal.geometry?.dispose();
      }

      // Material del decal
      const matDecal = new THREE.MeshPhongMaterial({
        map: texturaLogo,
        transparent: true,
        opacity: configLogo.opacidad,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -4,
        polygonOffsetUnits: -4
      });

      // Modo de fusión
      if (configLogo.fusion === 'multiply') {
        matDecal.blending = THREE.MultiplyBlending;
      } else {
        matDecal.blending = THREE.NormalBlending;
      }

      // Tamaño del decal
      const tam = 0.8 * configLogo.escala;
      const tamX = tam * (texturaLogo.image.width / Math.max(texturaLogo.image.height, 1));
      const tamY = tam;

      // Posición proyectada sobre la cara frontal
      const posicion = new THREE.Vector3(configLogo.x, configLogo.y, 1.2);
      const direccion = new THREE.Vector3(0, 0, 1);
      const orientacion = new THREE.Euler(0, 0, 0);

      // Crear geometría proyectada
      const geoDecal = new THREE.DecalGeometry(
        mallaExterior,
        posicion,
        direccion,
        orientacion,
        new THREE.Vector3(tamX, tamY, 1)
      );

      decal = new THREE.Mesh(geoDecal, matDecal);
      escena.add(decal);
    }

    // Conectar controles
    document.getElementById('logo-x').addEventListener('input', (e) => {
      configLogo.x = +e.target.value;
      actualizarDecal();
    });

    document.getElementById('logo-y').addEventListener('input', (e) => {
      configLogo.y = +e.target.value;
      actualizarDecal();
    });

    document.getElementById('logo-escala').addEventListener('input', (e) => {
      configLogo.escala = +e.target.value;
      actualizarDecal();
    });

    document.getElementById('logo-opacidad').addEventListener('input', (e) => {
      configLogo.opacidad = +e.target.value;
      actualizarDecal();
    });

    document.getElementById('modo-fusion').addEventListener('change', (e) => {
      configLogo.fusion = e.target.value;
      actualizarDecal();
    });

    // Quitar imagen
    btnQuitar.addEventListener('click', () => {
      if (decal) {
        escena.remove(decal);
        decal = null;
      }
      if (texturaLogo) {
        texturaLogo.dispose();
        texturaLogo = null;
      }
      entradaImagen.value = '';
      controlesLogo.classList.add('oculto');
    });

    // ==========================================================
    // ANIMACIÓN Y REDIMENSIONADO
    // ==========================================================
    function animar() {
      requestAnimationFrame(animar);
      controles.update();
      renderer.render(escena, camara);
    }
    animar();

    window.addEventListener('resize', () => {
      camara.aspect = contenedor.clientWidth / contenedor.clientHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(contenedor.clientWidth, contenedor.clientHeight);
    });
  </script>
</body>
  </html>
