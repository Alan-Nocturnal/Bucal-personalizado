<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bucal 3D Canaleta Real</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #080808; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    #viewport {
      width: 100vw;
      height: 55vh;
      background: radial-gradient(circle at center, #222222 0%, #030303 100%);
      touch-action: none;
    }
    
    .panel {
      width: 100%;
      max-width: 380px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group {
      background: #141414;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #282828;
    }

    .group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 0.85rem; }

    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      width: 100%;
      font-size: 0.85rem;
    }

    .btn-dark { background: #222; color: #ccc; }

    input[type="file"] { display: none; }
    .file-btn {
      display: block;
      background: #1f1f1f;
      color: #eee;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      border: 1px dashed #444;
    }
  </style>
</head>
<body>

  <div id="viewport"></div>

  <div class="panel">
    <div class="group">
      <label>Colores del Modelo</label>
      <div class="row">
        <span>Paredes Exteriores (Verde en tu dibujo)</span>
        <input type="color" id="extColor" value="#00cc44">
      </div>
      <div class="row" style="margin-top: 6px;">
        <span>Interior Canaleta (Morado en tu dibujo)</span>
        <input type="color" id="intColor" value="#a000fe">
      </div>
    </div>

    <div class="group">
      <label>Diseño / Logo Frontal</label>
      <label for="imgInput" class="file-btn">📁 Subir Imagen / Logo</label>
      <input type="file" id="imgInput" accept="image/*">
    </div>

    <div class="row">
      <button class="btn btn-dark" onclick="setView('front')">Frente</button>
      <button class="btn btn-dark" onclick="setView('top')">Ver Canaleta Arriba</button>
      <button class="btn btn-dark" onclick="setView('iso')">Vista 3D</button>
    </div>

    <button class="btn" onclick="exportPNG()">💾 Guardar Render PNG</button>
  </div>

  <script>
    // 1. Escena e Iluminación
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const light1 = new THREE.DirectionalLight(0xffffff, 1.3);
    light1.position.set(6, 12, 8);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0xffffff, 0.6);
    light2.position.set(-6, -4, -6);
    scene.add(light2);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    // 2. Materiales
    const extMat = new THREE.MeshStandardMaterial({
      color: 0x00cc44,
      roughness: 0.25,
      metalness: 0.05,
      side: THREE.DoubleSide
    });

    const intMat = new THREE.MeshStandardMaterial({
      color: 0xa000fe,
      roughness: 0.3,
      metalness: 0.0,
      side: THREE.DoubleSide
    });

    const mouthguardGroup = new THREE.Group();

    // 3. Generación Anatómica Real: Perfil en U hueco extruido a lo largo del arco dental
    function buildRealChannelMouthguard() {
      // Perfil del canal (corte transversal de la U):
      // Dibuja la pared externa alta, el piso donde apoyan los dientes y la pared interna corta
      const shape = new THREE.Shape();
      
      // Coordenadas del canal (X = Grosor/Ancho, Y = Altura)
      shape.moveTo(-0.6, 0.0);      // Base exterior inferior
      shape.lineTo(-0.6, 1.4);      // Pared exterior frontal (ALTA para incisivos)
      shape.lineTo(-0.35, 1.4);     // Grosor superior pared exterior
      shape.lineTo(-0.3, 0.35);     // Bajada interior de la canaleta
      shape.lineTo(0.3, 0.35);      // PISO HUECO DE LA CANALETA (Donde bajan los dientes)
      shape.lineTo(0.35, 0.9);      // Pared interior trasera (paladar)
      shape.lineTo(0.6, 0.9);       // Grosor superior pared interior
      shape.lineTo(0.6, 0.0);       // Base interior inferior
      shape.closePath();

      // Recorrido de la arcada dental (Forma de U visto desde arriba)
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.5, 0, -1.2),
        new THREE.Vector3(-2.1, 0, 1.1),
        new THREE.Vector3(-1.1, 0, 2.1),
        new THREE.Vector3(0.0, 0, 2.4),
        new THREE.Vector3(1.1, 0, 2.1),
        new THREE.Vector3(2.1, 0, 1.1),
        new THREE.Vector3(2.5, 0, -1.2)
      ]);

      const extrudeSettings = {
        steps: 120,
        bevelEnabled: true,
        bevelSegments: 4,
        bevelSize: 0.03,
        bevelThickness: 0.03,
        extrudePath: curve
      };

      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.center();
      return geo;
    }

    const baseGeo = buildRealChannelMouthguard();

    // Carcasa / Paredes Exteriores
    const outerMesh = new THREE.Mesh(baseGeo, extMat);
    mouthguardGroup.add(outerMesh);

    // Canaleta / Interior
    const innerMesh = new THREE.Mesh(baseGeo, intMat);
    innerMesh.scale.set(0.97, 0.97, 0.97);
    innerMesh.position.set(0, 0.02, 0);
    mouthguardGroup.add(innerMesh);

    scene.add(mouthguardGroup);

    // 4. Logo / Imagen Frontal
    let logoMesh;
    document.getElementById('imgInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        new THREE.TextureLoader().load(event.target.result, (texture) => {
          if (!logoMesh) {
            const planeGeo = new THREE.PlaneGeometry(1.6, 0.8);
            const planeMat = new THREE.MeshBasicMaterial({
              map: texture,
              transparent: true,
              depthTest: true
            });
            logoMesh = new THREE.Mesh(planeGeo, planeMat);
            logoMesh.position.set(0, 0.15, 2.5); // Apoyado directo en la pared frontal
            mouthguardGroup.add(logoMesh);
          } else {
            logoMesh.material.map = texture;
            logoMesh.material.needsUpdate = true;
          }
          renderer.render(scene, camera);
        });
      };
      reader.readAsDataURL(file);
    });

    // 5. Controles de Color
    document.getElementById('extColor').addEventListener('input', (e) => {
      extMat.color.set(e.target.value);
    });

    document.getElementById('intColor').addEventListener('input', (e) => {
      intMat.color.set(e.target.value);
    });

    // 6. Posicionamiento de Cámara
    function setView(type) {
      if (type === 'front') {
        camera.position.set(0, 0.1, 6.2);
      } else if (type === 'top') {
        camera.position.set(0, 6.2, 0.1); // Muestra perfectamente el hueco superior morado
      } else if (type === 'iso') {
        camera.position.set(3.2, 3.2, 4.8);
      }
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function exportPNG() {
      renderer.render(scene, camera);
      const dataURL = renderer.domElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'bucal-canaleta-3d.png';
      link.href = dataURL;
      link.click();
    }

    setView('iso');

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
