<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Personalizador Realista Bucales</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    h1 { font-size: 1.1rem; margin-bottom: 12px; text-align: center; }
    
    .canvas-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #2a2a2a 0%, #0d0d0d 100%);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    
    .controls {
      width: 100%;
      max-width: 340px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-group {
      background: #1e1e1e;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .control-group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-secondary { background: #333; }
    .btn-blue { background: #2563eb; }

    input[type="file"] { display: none; }
    .file-label {
      display: block;
      background: #2a2a2a;
      border: 1px dashed #555;
      color: white;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>Personalizador Anatómico Pro</h1>

  <div class="canvas-wrapper">
    <canvas id="c" width="320" height="320"></canvas>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Colores del Bucal</label>
      <div class="row">
        <span>Carcasa Exterior (Negro/Goma):</span>
        <input type="color" id="outerColor" value="#1a1a1a">
      </div>
      <div class="row" style="margin-top:6px;">
        <span>Interior (Gel/Encía):</span>
        <input type="color" id="innerColor" value="#e50914">
      </div>
    </div>

    <div class="control-group">
      <label>Imagen / Estampa Frontal</label>
      <label for="imgUpload" class="file-label">📁 Subir Logo desde el Celular</label>
      <input type="file" id="imgUpload" accept="image/*">
    </div>

    <button class="btn btn-secondary" onclick="deleteSelected()">🗑️ Eliminar Imagen Seleccionada</button>
    <button class="btn" onclick="exportPNG()">💾 Guardar Diseño</button>
  </div>

  <script>
    const canvas = new fabric.Canvas('c');

    // Trazado Anatómico exacto basado en el modelo OPRO/Gel (Vista Superior Anatómica)
    // 1. Capa Gel Interior
    const innerPath = new fabric.Path('M 60,180 C 60,80 260,80 260,180 C 260,200 220,210 200,210 C 180,210 170,185 160,185 C 150,185 140,210 120,210 C 100,210 60,200 60,180 Z', {
      fill: '#e50914',
      stroke: '#a00000',
      strokeWidth: 2,
      selectable: false,
      evented: false
    });

    // 2. Capa Exterior de Protección (Paredes)
    const outerPath = new fabric.Path('M 45,180 C 45,65 275,65 275,180 C 275,220 225,230 195,230 C 175,230 168,205 160,205 C 152,205 145,230 125,230 C 95,230 45,220 45,180 Z M 70,180 C 70,95 250,95 250,180 C 250,195 220,200 200,200 C 180,200 170,175 160,175 C 150,175 140,200 120,200 C 100,200 70,195 70,180 Z', {
      fill: '#1a1a1a',
      fillRule: 'evenodd',
      stroke: '#000000',
      strokeWidth: 2,
      selectable: false,
      evented: false
    });

    // 3. Canal Respiratorio Central (Muesca frontal)
    const ventPath = new fabric.Path('M 154,195 C 154,185 166,185 166,195 C 166,205 154,205 154,195 Z', {
      fill: '#0d0d0d',
      selectable: false,
      evented: false
    });

    canvas.add(innerPath);
    canvas.add(outerPath);
    canvas.add(ventPath);

    // Controles de Color
    document.getElementById('outerColor').addEventListener('input', (e) => {
      outerPath.set('fill', e.target.value);
      canvas.renderAll();
    });

    document.getElementById('innerColor').addEventListener('input', (e) => {
      innerPath.set('fill', e.target.value);
      canvas.renderAll();
    });

    // Cargar Logo
    document.getElementById('imgUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(f) {
        fabric.Image.fromURL(f.target.result, function(img) {
          img.scaleToWidth(60);
          img.set({
            left: 130,
            top: 130,
            cornerStyle: 'circle',
            cornerColor: '#2563eb',
            borderColor: '#2563eb'
          });
          canvas.add(img);
          canvas.setActiveObject(img);
        });
      };
      reader.readAsDataURL(file);
    });

    function deleteSelected() {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj !== innerPath && activeObj !== outerPath && activeObj !== ventPath) {
        canvas.remove(activeObj);
      }
    }

    function exportPNG() {
      canvas.discardActiveObject();
      canvas.renderAll();
      const link = document.createElement('a');
      link.download = 'mi-bucal.png';
      link.href = canvas.toDataURL({ format: 'png', quality: 1.0 });
      link.click();
    }
  </script>
</body>
</html>
