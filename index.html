<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Protector Bucal 3D Profesional</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #080808; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    #viewport {
      width: 100vw;
      height: 55vh;
      background: radial-gradient(circle at center, #252525 0%, #030303 100%);
      touch-action: none;
    }
    
    .panel {
      width: 100%;
      max-width: 380px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group {
      background: #141414;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #282828;
    }

    .group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 0.85rem; }

    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      width: 100%;
      font-size: 0.85rem;
    }

    .btn-dark { background: #222; color: #ccc; }

    input[type="file"] { display: none; }
    .file-btn {
      display: block;
      background: #1f1f1f;
      color: #eee;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      border: 1px dashed #444;
    }
  </style>
</head>
<body>

  <div id="viewport"></div>

  <div class="panel">
    <div class="group">
      <label>Personalización de Colores</label>
      <div class="row">
        <span>Escudo Frontal (Carcasa Externa)</span>
        <input type="color" id="extColor" value="#ffffff">
      </div>
      <div class="row" style="margin-top: 6px;">
        <span>Gel Interior (Canaleta de Dientes)</span>
        <input type="color" id="intColor" value="#cc0000">
      </div>
    </div>

    <div class="group">
      <label>Diseño / Logo Frontal</label>
      <label for="imgInput" class="file-btn">📁 Cargar Imagen Frontal</label>
      <input type="file" id="imgInput" accept="image/*">
    </div>

    <div class="row">
      <button class="btn btn-dark" onclick="setView('front')">Frente</button>
      <button class="btn btn-dark" onclick="setView('top')">Canaleta Dientes</button>
      <button class="btn btn-dark" onclick="setView('iso')">Vista 3D</button>
    </div>

    <button class="btn" onclick="exportPNG()">💾 Guardar Imagen PNG</button>
  </div>

  <script>
    // 1. Escena
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación
    const light1 = new THREE.DirectionalLight(0xffffff, 1.4);
    light1.position.set(5, 10, 7);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
    light2.position.set(-5, -2, -5);
    scene.add(light2);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // 2. Materiales
    const extMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.2,
      metalness: 0.05
    });

    const intMat = new THREE.MeshStandardMaterial({
      color: 0xcc0000,
      roughness: 0.35,
      metalness: 0.0
    });

    const mouthguardGroup = new THREE.Group();

    // 3. Geometría Precisa: Canaleta en U profunda (Estilo Venum / Custom MMA)
    function generateMouthguardMesh() {
      // Perfil transversal de la canaleta con pared frontal curva alta y canal hueco arriba
      const shape = new THREE.Shape();
      shape.moveTo(-0.4, 0.0);        // Pared frontal interior
      shape.lineTo(-0.5, 1.2);       // Altura pared frontal exterior
      shape.lineTo(-0.2, 1.3);       // Borde superior biselado de la encía
      shape.lineTo(-0.1, 0.3);       // Fondo de la canaleta donde descansan los dientes
      shape.lineTo(0.3, 0.3);        // Ancho del piso para molares/incisivos
      shape.lineTo(0.4, 0.8);        // Pared trasera (lado del paladar)
      shape.lineTo(0.6, 0.7);        // Borde pared trasera
      shape.lineTo(0.5, 0.0);        // Base exterior de mordida
      shape.closePath();

      // Recorrido parabólico en "U" exacto a la dentadura humana
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.4, 0, -1.0),
        new THREE.Vector3(-2.1, 0, 1.0),
        new THREE.Vector3(-1.2, 0, 2.0),
        new THREE.Vector3(0.0, 0, 2.3),
        new THREE.Vector3(1.2, 0, 2.0),
        new THREE.Vector3(2.1, 0, 1.0),
        new THREE.Vector3(2.4, 0, -1.0)
      ]);

      const extrudeSettings = {
        steps: 100,
        bevelEnabled: true,
        bevelSegments: 4,
        bevelSize: 0.04,
        bevelThickness: 0.04,
        extrudePath: curve
      };

      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.center();
      return geo;
    }

    const baseGeo = generateMouthguardMesh();

    // Carcasa exterior rígida
    const outerMesh = new THREE.Mesh(baseGeo, extMat);
    mouthguardGroup.add(outerMesh);

    // Revestimiento interior de gel (rojo en la canaleta)
    const innerMesh = new THREE.Mesh(baseGeo, intMat);
    innerMesh.scale.set(0.97, 0.97, 0.97);
    innerMesh.position.set(0, 0.02, -0.02);
    mouthguardGroup.add(innerMesh);

    scene.add(mouthguardGroup);

    // 4. Mapeo del Logo Frontal sobre la curva
    let logoMesh;
    document.getElementById('imgInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        new THREE.TextureLoader().load(event.target.result, (texture) => {
          if (!logoMesh) {
            const planeGeo = new THREE.PlaneGeometry(1.6, 0.9);
            const planeMat = new THREE.MeshBasicMaterial({
              map: texture,
              transparent: true,
              depthTest: true
            });
            logoMesh = new THREE.Mesh(planeGeo, planeMat);
            logoMesh.position.set(0, 0.1, 2.42); // Apoyado directo en la pared curva frontal
            mouthguardGroup.add(logoMesh);
          } else {
            logoMesh.material.map = texture;
            logoMesh.material.needsUpdate = true;
          }
          renderer.render(scene, camera);
        });
      };
      reader.readAsDataURL(file);
    });

    // 5. Manejadores de Color
    document.getElementById('extColor').addEventListener('input', (e) => {
      extMat.color.set(e.target.value);
    });

    document.getElementById('intColor').addEventListener('input', (e) => {
      intMat.color.set(e.target.value);
    });

    // 6. Configuración de Cámaras y Exportación
    function setView(type) {
      if (type === 'front') {
        camera.position.set(0, 0.1, 6.2);
      } else if (type === 'top') {
        camera.position.set(0, 6.2, 0.1); // Vista desde arriba mostrando la canaleta vacía de gel
      } else if (type === 'iso') {
        camera.position.set(3.2, 3.0, 4.8);
      }
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function exportPNG() {
      renderer.render(scene, camera);
      const dataURL = renderer.domElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'bucal-profesional-3d.png';
      link.href = dataURL;
      link.click();
    }

    setView('iso');

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
