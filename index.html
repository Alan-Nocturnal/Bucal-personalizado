<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bucal 3D Realista</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0a0a0a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    #viewport {
      width: 100vw;
      height: 55vh;
      background: radial-gradient(circle at center, #252525 0%, #050505 100%);
      touch-action: none;
    }
    
    .panel {
      width: 100%;
      max-width: 380px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group {
      background: #181818;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #282828;
    }

    .group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 0.85rem; }

    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      width: 100%;
      font-size: 0.85rem;
    }

    .btn-dark { background: #262626; color: #ccc; }

    input[type="file"] { display: none; }
    .file-btn {
      display: block;
      background: #222;
      color: #eee;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      border: 1px dashed #444;
    }
  </style>
</head>
<body>

  <div id="viewport"></div>

  <div class="panel">
    <div class="group">
      <label>Colores del Bucal</label>
      <div class="row">
        <span>Carcasa Exterior (Paredes)</span>
        <input type="color" id="extColor" value="#ffffff">
      </div>
      <div class="row" style="margin-top: 6px;">
        <span>Carril Interior (Hueco Dientes)</span>
        <input type="color" id="intColor" value="#cc0000">
      </div>
    </div>

    <div class="group">
      <label>Logo Frontal</label>
      <label for="imgInput" class="file-btn">📁 Seleccionar Imagen / Logo</label>
      <input type="file" id="imgInput" accept="image/*">
    </div>

    <div class="row">
      <button class="btn btn-dark" onclick="setView('front')">Vista Frontal</button>
      <button class="btn btn-dark" onclick="setView('top')">Ver Carril Dientes</button>
      <button class="btn btn-dark" onclick="setView('iso')">Vista 3D</button>
    </div>

    <button class="btn" onclick="exportPNG()">💾 Descargar Imagen PNG</button>
  </div>

  <script>
    // 1. Setup Three.js
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación
    const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(5, 10, 7);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0xffffff, 0.6);
    light2.position.set(-5, -2, -5);
    scene.add(light2);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    // 2. Materiales
    const extMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.2,
      metalness: 0.05
    });

    const intMat = new THREE.MeshStandardMaterial({
      color: 0xcc0000,
      roughness: 0.4,
      metalness: 0.0
    });

    const mouthguardGroup = new THREE.Group();

    // 3. Modelado 3D del perfil en "U" canalizado (Pared exterior, carril hundido, pared interior)
    function createMouthguardGeometry() {
      // Perfil transversal de la canaleta donde encajan los dientes
      const profileShape = new THREE.Shape();
      profileShape.moveTo(0, 0);          // Base exterior
      profileShape.lineTo(0.5, 0);       // Ancho pared exterior
      profileShape.lineTo(0.5, 1.4);     // Altura pared exterior
      profileShape.lineTo(0.4, 1.5);     // Borde suave
      profileShape.lineTo(0.3, 0.4);     // Bajada al carril dental (AHUECADO)
      profileShape.lineTo(-0.1, 0.3);    // Base donde apoyan los dientes
      profileShape.lineTo(-0.3, 1.0);    // Pared interior (más baja)
      profileShape.lineTo(-0.5, 0.9);
      profileShape.lineTo(-0.4, 0);      // Cierre
      profileShape.closePath();

      // Curva en "U" para simular la dentadura completa
      const arcPath = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.8, -1.2, 0),
        new THREE.Vector3(-2.2, 1.5, 0),
        new THREE.Vector3(0, 2.8, 0),
        new THREE.Vector3(2.2, 1.5, 0),
        new THREE.Vector3(2.8, -1.2, 0)
      ]);

      const extrudeSettings = {
        steps: 60,
        bevelEnabled: false,
        extrudePath: arcPath
      };

      return new THREE.ExtrudeGeometry(profileShape, extrudeSettings);
    }

    const mainGeo = createMouthguardGeometry();
    const outerMesh = new THREE.Mesh(mainGeo, extMat);
    outerMesh.rotation.x = -Math.PI / 2;
    mouthguardGroup.add(outerMesh);

    // Muesca Frontal del Frenillo
    const notchGeo = new THREE.CylinderGeometry(0.3, 0.3, 1, 16);
    const notchMat = new THREE.MeshBasicMaterial({ colorWrite: false }); // Cortador
    const notch = new THREE.Mesh(notchGeo, notchMat);
    notch.position.set(0, 0.8, 1.2);

    // Gel del carril interior (resaltado de color)
    const innerGeo = createMouthguardGeometry();
    const innerMesh = new THREE.Mesh(innerGeo, intMat);
    innerMesh.rotation.x = -Math.PI / 2;
    innerMesh.scale.set(0.96, 0.96, 0.96);
    innerMesh.position.set(0, 0.05, 0);
    mouthguardGroup.add(innerMesh);

    scene.add(mouthguardGroup);

    // 4. Carga de Logo sobre la pared frontal
    let logoMesh;
    document.getElementById('imgInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const texture = new THREE.TextureLoader().load(event.target.result, () => {
          renderer.render(scene, camera);
        });

        if (!logoMesh) {
          const planeGeo = new THREE.PlaneGeometry(1.2, 0.8);
          const planeMat = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            depthTest: true
          });
          logoMesh = new THREE.Mesh(planeGeo, planeMat);
          logoMesh.position.set(0, 0.2, 1.6); // Posición exacta en la cara frontal exterior
          mouthguardGroup.add(logoMesh);
        } else {
          logoMesh.material.map = texture;
          logoMesh.material.needsUpdate = true;
        }
      };
      reader.readAsDataURL(file);
    });

    // 5. Controles de Color
    document.getElementById('extColor').addEventListener('input', (e) => {
      extMat.color.set(e.target.value);
    });

    document.getElementById('intColor').addEventListener('input', (e) => {
      intMat.color.set(e.target.value);
    });

    // 6. Camara y Vistas
    function setView(type) {
      if (type === 'front') {
        camera.position.set(0, 0.2, 6.5);
      } else if (type === 'top') {
        camera.position.set(0, 6.5, 0.5);
      } else if (type === 'iso') {
        camera.position.set(3.5, 3.5, 5);
      }
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function exportPNG() {
      renderer.render(scene, camera);
      const dataURL = renderer.domElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'bucal-3d.png';
      link.href = dataURL;
      link.click();
    }

    setView('iso');

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
