<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Protector Bucal 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #080808; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 20px; }
    
    #viewport {
      width: 100vw;
      height: 55vh;
      background: radial-gradient(circle at center, #222222 0%, #030303 100%);
      touch-action: none;
    }
    
    .panel {
      width: 100%;
      max-width: 380px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group {
      background: #141414;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #282828;
    }

    .group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 0.85rem; flex-wrap: wrap; }
    .row-full { width: 100%; margin-top: 6px; }

    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="range"] {
      width: 100%; accent-color: #e50914;
    }

    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      width: 100%;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .btn:hover { filter: brightness(1.1); }

    .btn-dark { background: #222; color: #ccc; }
    .btn-copy { background: #106b21; color: #fff; }
    .btn-copy:active { background: #158829; }

    input[type="file"] { display: none; }
    .file-btn {
      display: block;
      background: #1f1f1f;
      color: #eee;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      border: 1px dashed #444;
    }

    .copy-msg {
      font-size: 0.75rem;
      color: #4ade80;
      margin-top: 4px;
      height: 18px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .copy-msg.show { opacity: 1; }

    textarea { position: absolute; left: -9999px; }
  </style>
</head>
<body>

  <div id="viewport"></div>

  <div class="panel">
    <div class="group">
      <label>Colores del Modelo</label>
      <div class="row">
        <span>Exterior / Paredes</span>
        <input type="color" id="extColor" value="#ff0000">
      </div>
      <div class="row" style="margin-top: 6px;">
        <span>Interior / Canaleta</span>
        <input type="color" id="intColor" value="#000000">
      </div>
    </div>

    <div class="group">
      <label>Diseño / Logo Frontal</label>
      <label for="imgInput" class="file-btn">📁 Subir Imagen / Logo</label>
      <input type="file" id="imgInput" accept="image/*">

      <div class="row row-full" style="margin-top: 10px;">
        <span>Tamaño Logo</span>
        <input type="range" id="logoScale" min="0.2" max="3" step="0.05" value="1">
      </div>
      <div class="row row-full">
        <span>Posición Horizontal</span>
        <input type="range" id="logoX" min="-2.5" max="2.5" step="0.05" value="0">
      </div>
      <div class="row row-full">
        <span>Posición Vertical</span>
        <input type="range" id="logoY" min="-1.5" max="2.5" step="0.05" value="0.6">
      </div>
    </div>

    <div class="row">
      <button class="btn btn-dark" onclick="setView('front')">Frente</button>
      <button class="btn btn-dark" onclick="setView('top')">Arriba</button>
      <button class="btn btn-dark" onclick="setView('iso')">Vista 3D</button>
    </div>

    <button class="btn" onclick="exportPNG()">💾 Guardar Render PNG</button>
    <button class="btn btn-copy" onclick="copyCode()">📋 Copiar Código Completo</button>
    <div id="copyMessage" class="copy-msg">✅ ¡Código copiado al portapapeles!</div>
  </div>

  <textarea id="fullCode" readonly></textarea>

  <script>
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación
    const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(5, 8, 6);
    scene.add(light1);
    const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
    light2.position.set(-5, 6, -4);
    scene.add(light2);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // Materiales
    const extMat = new THREE.MeshStandardMaterial({
      color: 0xff0000,
      roughness: 0.35,
      metalness: 0.05,
      side: THREE.FrontSide
    });
    const intMat = new THREE.MeshStandardMaterial({
      color: 0x000000,
      roughness: 0.4,
      metalness: 0.0,
      side: THREE.FrontSide
    });

    const mouthguardGroup = new THREE.Group();

    // =========================================================
    // CONSTRUCCIÓN CORRECTA: Forma de herradura abierta
    // =========================================================

    // Puntos de la arcada (vista desde arriba: forma de U abierta por detrás)
    const arcPoints = [
      new THREE.Vector2(-2.4, -1.0),
      new THREE.Vector2(-2.1,  0.6),
      new THREE.Vector2(-1.2,  1.5),
      new THREE.Vector2( 0.0,  1.8),
      new THREE.Vector2( 1.2,  1.5),
      new THREE.Vector2( 2.1,  0.6),
      new THREE.Vector2( 2.4, -1.0)
    ];

    function buildGuardShape(thickness = 0.28, wallHeight = 0.7) {
      const group = new THREE.Group();

      // --- PISO base del protector ---
      const baseShape = new THREE.Shape();
      baseShape.moveTo(arcPoints[0].x, arcPoints[0].y);
      for (let i = 1; i < arcPoints.length; i++) {
        baseShape.lineTo(arcPoints[i].x, arcPoints[i].y);
      }
      const baseGeo = new THREE.ExtrudeGeometry(baseShape, {
        depth: 0.12,
        bevelEnabled: true,
        bevelSize: 0.04,
        bevelThickness: 0.04,
        bevelSegments: 3
      });
      baseGeo.rotateX(-Math.PI / 2);
      const baseMesh = new THREE.Mesh(baseGeo, extMat);
      group.add(baseMesh);

      // --- PARED EXTERIOR ---
      const outerWallPoints = [];
      for (const p of arcPoints) {
        const dir = p.clone().normalize();
        outerWallPoints.push(new THREE.Vector2(p.x + dir.x * thickness * 0.55, p.y + dir.y * thickness * 0.55));
      }
      const outerShape = new THREE.Shape();
      outerShape.moveTo(outerWallPoints[0].x, outerWallPoints[0].y);
      for (let i = 1; i < outerWallPoints.length; i++) {
        outerShape.lineTo(outerWallPoints[i].x, outerWallPoints[i].y);
      }
      const outerWallGeo = new THREE.ExtrudeGeometry(outerShape, {
        depth: wallHeight,
        bevelEnabled: true,
        bevelSize: 0.03,
        bevelThickness: 0.03,
        bevelSegments: 3
      });
      outerWallGeo.rotateX(-Math.PI / 2);
      outerWallGeo.translate(0, 0.12, 0);
      const outerMesh = new THREE.Mesh(outerWallGeo, extMat);
      group.add(outerMesh);

      // --- PARED INTERIOR (canaleta) ---
      const innerWallPoints = [];
      for (const p of arcPoints) {
        const dir = p.clone().normalize();
        innerWallPoints.push(new THREE.Vector2(p.x - dir.x * thickness * 0.45, p.y - dir.y * thickness * 0.45));
      }
      const innerShape = new THREE.Shape();
      innerShape.moveTo(innerWallPoints[0].x, innerWallPoints[0].y);
      for (let i = 1; i < innerWallPoints.length; i++) {
        innerShape.lineTo(innerWallPoints[i].x, innerWallPoints[i].y);
      }
      const innerWallGeo = new THREE.ExtrudeGeometry(innerShape, {
        depth: wallHeight * 0.75,
        bevelEnabled: true,
        bevelSize: 0.03,
        bevelThickness: 0.03,
        bevelSegments: 3
      });
      innerWallGeo.rotateX(-Math.PI / 2);
      innerWallGeo.translate(0, 0.12, 0);
      const innerMesh = new THREE.Mesh(innerWallGeo, intMat);
      group.add(innerMesh);

      return group;
    }

    const guard = buildGuardShape();
    mouthguardGroup.add(guard);
    scene.add(mouthguardGroup);

    // --- LOGO ---
    let logoMesh = null;
    const logoSettings = { scale: 1, x: 0, y: 0.6, z: 2.2 };

    function updateLogoTransform() {
      if (!logoMesh) return;
      logoMesh.scale.setScalar(logoSettings.scale);
      logoMesh.position.set(logoSettings.x, logoSettings.y, logoSettings.z);
    }

    document.getElementById('imgInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const texture = new THREE.Texture(img);
        texture.needsUpdate = true;
        if (!logoMesh) {
          logoMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1.4, 0.7),
            new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false })
          );
          mouthguardGroup.add(logoMesh);
        } else {
          logoMesh.material.map = texture;
          logoMesh.material.needsUpdate = true;
        }
        updateLogoTransform();
        renderer.render(scene, camera);
      };
      img.src = URL.createObjectURL(file);
    });

    document.getElementById('logoScale').addEventListener('input', e => {
      logoSettings.scale = parseFloat(e.target.value);
      updateLogoTransform();
    });
    document.getElementById('logoX').addEventListener('input', e => {
      logoSettings.x = parseFloat(e.target.value);
      updateLogoTransform();
    });
    document.getElementById('logoY').addEventListener('input', e => {
      logoSettings.y = parseFloat(e.target.value);
      updateLogoTransform();
    });

    // --- COLORES ---
    document.getElementById('extColor').addEventListener('input', e => {
      const c = new THREE.Color(e.target.value);
      extMat.color.set(c);
    });
    document.getElementById('intColor').addEventListener('input', e => {
      const c = new THREE.Color(e.target.value);
      intMat.color.set(c);
    });

    // --- VISTAS ---
    function setView(type) {
      if (type === 'front') {
        camera.position.set(0, 1.2, 5.5);
      } else if (type === 'top') {
        camera.position.set(0, 5, 0.01);
      } else if (type === 'iso') {
        camera.position.set(3.8, 3.2, 3.8);
      }
      controls.target.set(0, 0.35, 0);
      controls.update();
    }

    function exportPNG() {
      renderer.render(scene, camera);
      const a = document.createElement('a');
      a.download = 'protector-bucal.png';
      a.href = renderer.domElement.toDataURL('image/png');
      a.click();
    }

    function copyCode() {
      const fullHTML = document.documentElement.outerHTML;
      navigator.clipboard.writeText(fullHTML).then(() => {
        document.getElementById('copyMessage').classList.add('show');
        setTimeout(() => document.getElementById('copyMessage').classList.remove('show'), 2500);
      });
    }

    setView('iso');
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
