<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Personalizador Bucal 3D Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0a0a0a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    #viewport {
      width: 100vw;
      height: 55vh;
      background: radial-gradient(circle at center, #222222 0%, #050505 100%);
      touch-action: none;
    }
    
    .panel {
      width: 100%;
      max-width: 380px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group {
      background: #181818;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #282828;
    }

    .group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 0.85rem; }

    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      width: 100%;
      font-size: 0.85rem;
    }

    .btn-dark { background: #262626; color: #ccc; }

    input[type="file"] { display: none; }
    .file-btn {
      display: block;
      background: #222;
      color: #eee;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      border: 1px dashed #444;
    }
  </style>
</head>
<body>

  <div id="viewport"></div>

  <div class="panel">
    <div class="group">
      <label>Colores del Bucal</label>
      <div class="row">
        <span>Carcasa Exterior (Frente)</span>
        <input type="color" id="extColor" value="#ffffff">
      </div>
      <div class="row" style="margin-top: 6px;">
        <span>Gel Interior (Canal Dientes)</span>
        <input type="color" id="intColor" value="#111111">
      </div>
    </div>

    <div class="group">
      <label>Logo Frontal</label>
      <label for="imgInput" class="file-btn">📁 Subir Imagen desde el Celular</label>
      <input type="file" id="imgInput" accept="image/*">
    </div>

    <div class="row">
      <button class="btn btn-dark" onclick="setView('front')">Vista Frontal</button>
      <button class="btn btn-dark" onclick="setView('top')">Canal Superior</button>
      <button class="btn btn-dark" onclick="setView('iso')">Perspectiva 3D</button>
    </div>

    <button class="btn" onclick="exportPNG()">💾 Guardar Diseño PNG</button>
  </div>

  <script>
    // 1. Configuración del escenario 3D
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Luces de estudio
    const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(5, 12, 8);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
    light2.position.set(-5, 4, -5);
    scene.add(light2);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    // 2. Materiales
    const extMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.25,
      metalness: 0.05
    });

    const intMat = new THREE.MeshStandardMaterial({
      color: 0x111111,
      roughness: 0.4,
      metalness: 0.0
    });

    const mouthguardGroup = new THREE.Group();

    // 3. Generación geométrica anatómica (Cuenca en U abierta hacia arriba)
    function buildAnatomicalMouthguard() {
      // Puntos del arco dental superior
      const pointsCount = 40;
      const outerGeo = new THREE.BufferGeometry();
      const innerGeo = new THREE.BufferGeometry();

      // Creamos la canaleta en U orientada verticalmente
      // Pared exterior alta (frente), suelo (base) y pared interior corta (paladar)
      const outerVertices = [];
      const innerVertices = [];
      const indices = [];

      // Curva paramétrica en U
      for (let i = 0; i <= pointsCount; i++) {
        const t = (i / pointsCount) * Math.PI; // De 0 a PI (Arco)
        const angle = t - Math.PI / 2;

        // Radios
        const rOut = 2.8 + Math.cos(angle * 2) * 0.2;
        const rMid = 2.3 + Math.cos(angle * 2) * 0.2;
        const rIn  = 1.8 + Math.cos(angle * 2) * 0.2;

        // Coordenadas base
        const xOut = Math.sin(angle) * rOut;
        const zOut = Math.cos(angle) * rOut;

        const xMid = Math.sin(angle) * rMid;
        const zMid = Math.cos(angle) * rMid;

        const xIn  = Math.sin(angle) * rIn;
        const zIn  = Math.cos(angle) * rIn;

        // Muesca central en V para el frenillo nasal/superior
        const isCenter = Math.abs(angle) < 0.2;
        const frontHeight = isCenter ? 1.0 : 1.4; // Bajada central para incisivos/frenillo

        // Pared Exterior (Frente alto)
        outerVertices.push(xOut, frontHeight, zOut); // Top exterior
        outerVertices.push(xOut, -0.2, zOut);        // Base exterior

        // Gel Interior (Canaleta vacía superior)
        innerVertices.push(xMid, 0.1, zMid);         // Suelo del canal dental
        innerVertices.push(xIn, 0.8, zIn);           // Pared palatina trasera
      }

      // Geometría sólida compuesta mediante Lathe / Extrusión curva sobre la ruta en U
      const shape = new THREE.Shape();
      // Perfil transversal de la U hacia arriba:
      shape.moveTo(0, 1.4);         // Pared exterior alta
      shape.lineTo(0.1, -0.2);      // Esquina base exterior
      shape.lineTo(0.6, -0.2);      // Base ancha
      shape.lineTo(0.7, 0.7);       // Pared interior
      shape.lineTo(0.5, 0.7);       // Borde pared interior
      shape.lineTo(0.4, 0.1);       // Canaleta ahuecada donde entran los dientes
      shape.lineTo(0.2, 1.2);       // Bajada interior pared frontal
      shape.closePath();

      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.6, 0, -1.2),
        new THREE.Vector3(-2.2, 0, 1.2),
        new THREE.Vector3(0, 0, 2.4),
        new THREE.Vector3(2.2, 0, 1.2),
        new THREE.Vector3(2.6, 0, -1.2)
      ]);

      const extrudeSettings = {
        steps: 80,
        bevelEnabled: true,
        bevelSegments: 4,
        bevelSize: 0.05,
        bevelThickness: 0.05,
        extrudePath: curve
      };

      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.center();
      return geo;
    }

    const mainGeo = buildAnatomicalMouthguard();
    
    // Capa Externa (Carcasa)
    const outerMesh = new THREE.Mesh(mainGeo, extMat);
    mouthguardGroup.add(outerMesh);

    // Capa Interna (Gel del canal)
    const innerMesh = new THREE.Mesh(mainGeo, intMat);
    innerMesh.scale.set(0.97, 0.97, 0.97);
    innerMesh.position.y = 0.03;
    mouthguardGroup.add(innerMesh);

    scene.add(mouthguardGroup);

    // 4. Logo Frontal
    let logoMesh;
    document.getElementById('imgInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        new THREE.TextureLoader().load(event.target.result, (texture) => {
          if (!logoMesh) {
            const planeGeo = new THREE.PlaneGeometry(1.4, 0.8);
            const planeMat = new THREE.MeshBasicMaterial({
              map: texture,
              transparent: true,
              depthTest: true
            });
            logoMesh = new THREE.Mesh(planeGeo, planeMat);
            logoMesh.position.set(0, 0.15, 2.45); // Frente exacto de los incisivos
            mouthguardGroup.add(logoMesh);
          } else {
            logoMesh.material.map = texture;
            logoMesh.material.needsUpdate = true;
          }
          renderer.render(scene, camera);
        });
      };
      reader.readAsDataURL(file);
    });

    // 5. Ajustes de Color
    document.getElementById('extColor').addEventListener('input', (e) => {
      extMat.color.set(e.target.value);
    });

    document.getElementById('intColor').addEventListener('input', (e) => {
      intMat.color.set(e.target.value);
    });

    // 6. Controles de Cámara
    function setView(type) {
      if (type === 'front') {
        camera.position.set(0, 0.3, 6.5);
      } else if (type === 'top') {
        camera.position.set(0, 6.5, 0.2); // Muestra la canaleta vacía donde entran los dientes
      } else if (type === 'iso') {
        camera.position.set(3.8, 3.2, 4.8);
      }
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function exportPNG() {
      renderer.render(scene, camera);
      const dataURL = renderer.domElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'bucal-3d.png';
      link.href = dataURL;
      link.click();
    }

    setView('iso');

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
