<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bucal 3D Canaleta Real</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #080808; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 20px; }
    
    #viewport {
      width: 100vw;
      height: 55vh;
      background: radial-gradient(circle at center, #222222 0%, #030303 100%);
      touch-action: none;
    }
    
    .panel {
      width: 100%;
      max-width: 380px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group {
      background: #141414;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #282828;
    }

    .group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 0.85rem; flex-wrap: wrap; }
    .row-full { width: 100%; margin-top: 6px; }

    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="range"] {
      width: 100%; accent-color: #e50914;
    }

    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      width: 100%;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .btn:hover { filter: brightness(1.1); }

    .btn-dark { background: #222; color: #ccc; }
    .btn-copy { background: #106b21; color: #fff; }
    .btn-copy:active { background: #158829; }

    input[type="file"] { display: none; }
    .file-btn {
      display: block;
      background: #1f1f1f;
      color: #eee;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      border: 1px dashed #444;
    }

    .copy-msg {
      font-size: 0.75rem;
      color: #4ade80;
      margin-top: 4px;
      height: 18px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .copy-msg.show { opacity: 1; }

    textarea { position: absolute; left: -9999px; }
  </style>
</head>
<body>

  <div id="viewport"></div>

  <div class="panel">
    <div class="group">
      <label>Colores del Modelo</label>
      <div class="row">
        <span>Paredes Exteriores</span>
        <input type="color" id="extColor" value="#00cc44">
      </div>
      <div class="row" style="margin-top: 6px;">
        <span>Interior Canaleta</span>
        <input type="color" id="intColor" value="#a000fe">
      </div>
    </div>

    <div class="group">
      <label>Diseño / Logo Frontal</label>
      <label for="imgInput" class="file-btn">📁 Subir Imagen / Logo</label>
      <input type="file" id="imgInput" accept="image/*">

      <div class="row row-full" style="margin-top: 10px;">
        <span>Tamaño Logo</span>
        <input type="range" id="logoScale" min="0.2" max="3" step="0.05" value="1">
      </div>
      <div class="row row-full">
        <span>Posición Horizontal</span>
        <input type="range" id="logoX" min="-2.5" max="2.5" step="0.05" value="0">
      </div>
      <div class="row row-full">
        <span>Posición Vertical</span>
        <input type="range" id="logoY" min="-1.5" max="2.5" step="0.05" value="0.6">
      </div>
    </div>

    <div class="row">
      <button class="btn btn-dark" onclick="setView('front')">Frente</button>
      <button class="btn btn-dark" onclick="setView('top')">Arriba</button>
      <button class="btn btn-dark" onclick="setView('iso')">Vista 3D</button>
    </div>

    <button class="btn" onclick="exportPNG()">💾 Guardar Render PNG</button>
    <button class="btn btn-copy" onclick="copyCode()">📋 Copiar Código Completo</button>
    <div id="copyMessage" class="copy-msg">✅ ¡Código copiado al portapapeles!</div>
  </div>

  <textarea id="fullCode" readonly></textarea>

  <script>
    // 1. Escena e Iluminación
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const light1 = new THREE.DirectionalLight(0xffffff, 1.3);
    light1.position.set(6, 12, 8);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0xffffff, 0.6);
    light2.position.set(-6, -4, -6);
    scene.add(light2);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    // 2. Materiales
    const extMat = new THREE.MeshStandardMaterial({
      color: 0x00cc44,
      roughness: 0.25,
      metalness: 0.05,
      side: THREE.FrontSide
    });

    const intMat = new THREE.MeshStandardMaterial({
      color: 0xa000fe,
      roughness: 0.3,
      metalness: 0.0,
      side: THREE.FrontSide
    });

    const mouthguardGroup = new THREE.Group();

    // 3. CANALETA EN FORMA DE "U" REAL
    function buildRealChannelMouthguard(scale = 1.0, inset = 0.0) {
      // PERFIL TRANSVERSAL EN FORMA DE U
      const shape = new THREE.Shape();
      const wallHeight = 1.1 * scale;
      const baseWidth = 1.0 * scale;
      const wallThickness = 0.18 * scale;
      const floorThickness = 0.15 * scale;

      // Desplazamiento interior para la canaleta
      const shift = inset;

      // Pared exterior (más alta)
      shape.moveTo(-baseWidth/2 - shift, 0);
      shape.lineTo(-baseWidth/2 - shift, wallHeight);
      shape.lineTo(-baseWidth/2 + wallThickness - shift, wallHeight);
      shape.lineTo(-baseWidth/2 + wallThickness - shift, floorThickness);

      // Piso de la canaleta
      shape.lineTo(baseWidth/2 - wallThickness + shift, floorThickness);

      // Pared interior (más baja, hacia el paladar)
      shape.lineTo(baseWidth/2 - wallThickness + shift, wallHeight * 0.65);
      shape.lineTo(baseWidth/2 + shift, wallHeight * 0.65);
      shape.lineTo(baseWidth/2 + shift, 0);

      shape.closePath();

      // ARCADA DENTAL: forma de U vista desde arriba
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.6, 0, -1.0),
        new THREE.Vector3(-2.2, 0, 0.8),
        new THREE.Vector3(-1.2, 0, 1.8),
        new THREE.Vector3(0.0, 0, 2.1),
        new THREE.Vector3(1.2, 0, 1.8),
        new THREE.Vector3(2.2, 0, 0.8),
        new THREE.Vector3(2.6, 0, -1.0)
      ], false); // curva ABIERTA = forma de U, no anillo

      const extrudeSettings = {
        steps: 160,
        bevelEnabled: true,
        bevelSegments: 3,
        bevelSize: 0.025,
        bevelThickness: 0.025,
        extrudePath: curve,
        // EVITAR DEFORMACIÓN DEL PERFIL
        extrudeRotate: 0 // ¡Clave! Evita que el perfil rote y se deforme
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geometry.center();
      return geometry;
    }

    // Pared exterior
    const outerGeo = buildRealChannelMouthguard(1.0, 0);
    const outerMesh = new THREE.Mesh(outerGeo, extMat);
    mouthguardGroup.add(outerMesh);

    // Interior de la canaleta (hueco donde van los dientes)
    const innerGeo = buildRealChannelMouthguard(0.94, 0.06);
    const innerMesh = new THREE.Mesh(innerGeo, intMat);
    mouthguardGroup.add(innerMesh);

    scene.add(mouthguardGroup);

    // 4. Logo con controles de posición y tamaño
    let logoMesh = null;
    const logoSettings = { scale: 1, x: 0, y: 0.6, z: 2.6 };

    function updateLogoTransform() {
      if (!logoMesh) return;
      logoMesh.scale.setScalar(logoSettings.scale);
      logoMesh.position.set(logoSettings.x, logoSettings.y, logoSettings.z);
    }

    document.getElementById('imgInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const texture = new THREE.Texture(img);
        texture.needsUpdate = true;
        if (!logoMesh) {
          logoMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1.6, 0.8),
            new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false })
          );
          mouthguardGroup.add(logoMesh);
        } else {
          logoMesh.material.map = texture;
          logoMesh.material.needsUpdate = true;
        }
        updateLogoTransform();
        renderer.render(scene, camera);
      };
      img.src = URL.createObjectURL(file);
    });

    // Controles del logo
    document.getElementById('logoScale').addEventListener('input', e => {
      logoSettings.scale = parseFloat(e.target.value);
      updateLogoTransform();
    });
    document.getElementById('logoX').addEventListener('input', e => {
      logoSettings.x = parseFloat(e.target.value);
      updateLogoTransform();
    });
    document.getElementById('logoY').addEventListener('input', e => {
      logoSettings.y = parseFloat(e.target.value);
      updateLogoTransform();
    });

    // 5. Colores
    document.getElementById('extColor').addEventListener('input', e => extMat.color.set(e.target.value));
    document.getElementById('intColor').addEventListener('input', e => intMat.color.set(e.target.value));

    // 6. Cámaras
    function setView(type) {
      if (type === 'front') camera.position.set(0, 0.8, 6.2);
      else if (type === 'top') camera.position.set(0, 5, 0.1);
      else if (type === 'iso') camera.position.set(4.5, 4, 4.5);
      controls.target.set(0, 0.4, 0);
      controls.update();
    }

    function exportPNG() {
      renderer.render(scene, camera);
      const a = document.createElement('a');
      a.download = 'bucal-canaleta-3d.png';
      a.href = renderer.domElement.toDataURL('image/png');
      a.click();
    }

    // 📋 Copiar código completo al portapapeles
    function copyCode() {
      const fullHTML = document.documentElement.outerHTML;
      navigator.clipboard.writeText(fullHTML).then(() => {
        const msg = document.getElementById('copyMessage');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 2500);
      }).catch(() => {
        const ta = document.getElementById('fullCode');
        ta.value = fullHTML;
        ta.select();
        document.execCommand('copy');
        const msg = document.getElementById('copyMessage');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 2500);
      });
    }

    setView('iso');
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
