<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Configurador 3D — Protector Bucal</title>

  <!-- CDNs con rutas correctas para r128 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/DecalGeometry.js"></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --borde: #2a2a2a;
      --acento: #e50914;
      --texto: #f0f0f0;
      --texto-sec: #999;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--texto);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cargando {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      color: var(--texto-sec);
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--borde);
      border-top-color: var(--acento);
      border-radius: 50%;
      animation: girar 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    .panel {
      background: var(--panel);
      border-top: 1px solid var(--borde);
      padding: 1.2rem;
      max-height: 45vh;
      overflow-y: auto;
    }

    .panel h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #fff;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 0.5rem;
    }

    .fila {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.6rem 0;
      gap: 0.8rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--texto-sec);
      flex-shrink: 0;
    }

    input[type="color"] {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--acento);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-primario {
      background: var(--acento);
      color: white;
      margin-bottom: 0.6rem;
    }

    .btn-primario:hover { filter: brightness(1.1); }

    .btn-peligro {
      background: #2c1212;
      color: #ff6b6b;
      border: 1px solid #441a1a;
      margin-top: 0.5rem;
    }

    .btn-peligro:hover { background: #441a1a; }

    input[type="file"] { display: none; }

    .subir-label {
      display: block;
      background: #1f1f1f;
      text-align: center;
      padding: 0.9rem;
      border-radius: 8px;
      border: 1px dashed #444;
      cursor: pointer;
      margin-bottom: 0.6rem;
      font-size: 0.9rem;
    }

    .subir-label:hover { border-color: var(--acento); }

    .oculto { display: none !important; }
    .mensaje { font-size: 0.8rem; margin-top: 0.5rem; color: #6a9fb5; }
  </style>
</head>
<body>

  <div id="canvas-container">
    <div class="cargando" id="estado-carga">
      <div class="spinner"></div>
      <span>Cargando modelo...</span>
    </div>
  </div>

  <div class="panel">
    <h2>🎨 Colores</h2>
    <div class="fila">
      <label>Exterior</label>
      <input type="color" id="color-exterior" value="#ff0000" />
    </div>
    <div class="fila">
      <label>Interior / Canaleta</label>
      <input type="color" id="color-interior" value="#000000" />
    </div>

    <h2>🖼️ Logo / Gráfico</h2>
    <label for="entrada-imagen" class="subir-label">📁 Subir imagen desde equipo</label>
    <input type="file" id="entrada-imagen" accept="image/*" />

    <div id="controles-logo" class="oculto">
      <div class="fila">
        <label>Mover horizontal</label>
        <input type="range" id="logo-x" min="-1.5" max="1.5" step="0.01" value="0" />
      </div>
      <div class="fila">
        <label>Mover vertical</label>
        <input type="range" id="logo-y" min="-1.5" max="1.5" step="0.01" value="0" />
      </div>
      <div class="fila">
        <label>Escala</label>
        <input type="range" id="logo-escala" min="0.3" max="3" step="0.05" value="1" />
      </div>
      <div class="fila">
        <label>Opacidad</label>
        <input type="range" id="logo-opacidad" min="0" max="1" step="0.05" value="1" />
      </div>
      <div class="fila">
        <label>Modo fusión</label>
        <select id="modo-fusion" style="background:#1f1f1f; color:#fff; border:none; padding:0.3rem; border-radius:4px;">
          <option value="normal">Normal</option>
          <option value="multiply">Multiplicar</option>
        </select>
      </div>
      <button class="btn btn-peligro" id="btn-quitar">🗑️ Quitar imagen</button>
    </div>
    <p class="mensaje" id="info-nombres" style="color:#888; font-size:0.75rem;">
      💡 En Blender nombra materiales: <b>Exterior</b> e <b>Interior</b>
    </p>
  </div>

  <script>
    // ==========================================================
    // ESCENA Y RENDERER
    // ==========================================================
    const contenedor = document.getElementById('canvas-container');
    const estadoCarga = document.getElementById('estado-carga');

    const escena = new THREE.Scene();
    escena.background = new THREE.Color(0x0a0a0a);

    const camara = new THREE.PerspectiveCamera(45, contenedor.clientWidth / contenedor.clientHeight, 0.1, 100);
    camara.position.set(0, 1.2, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(contenedor.clientWidth, contenedor.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    contenedor.appendChild(renderer.domElement);

    // ==========================================================
    // CONTROLES DE CÁMARA RESTRINGIDOS
    // ==========================================================
    const controles = new THREE.OrbitControls(camara, renderer.domElement);
    controles.enableDamping = true;
    controles.dampingFactor = 0.05;
    controles.enablePan = false;

    controles.minAzimuthAngle = -Math.PI * 0.35; // -63°
    controles.maxAzimuthAngle = Math.PI * 0.35;  // +63°
    controles.minPolarAngle = Math.PI * 0.25;     // No ver por debajo
    controles.maxPolarAngle = Math.PI * 0.65;     // No pasar de arriba
    controles.target.set(0, 0.2, 0);

    // ==========================================================
    // ILUMINACIÓN
    // ==========================================================
    escena.add(new THREE.AmbientLight(0xffffff, 0.55));
    const luzPrincipal = new THREE.DirectionalLight(0xffffff, 1.3);
    luzPrincipal.position.set(3, 4, 5);
    escena.add(luzPrincipal);
    const luzRelleno = new THREE.DirectionalLight(0xfff4e5, 0.6);
    luzRelleno.position.set(-4, 3, 3);
    escena.add(luzRelleno);
    escena.add(new THREE.DirectionalLight(0xffffff, 0.4).position.set(0, 5, -3));

    // ==========================================================
    // VARIABLES
    // ==========================================================
    let modelo = null;
    let mallaExterior = null;
    let mallaPrincipal = null; // Para el Decal
    let mallaInterior = null;
    let decal = null;
    let texturaLogo = null;

    const matExterior = new THREE.MeshStandardMaterial({
      color: 0xff0000, roughness: 0.25, metalness: 0.05
    });
    const matInterior = new THREE.MeshStandardMaterial({
      color: 0x000000, roughness: 0.4, metalness: 0
    });

    // ==========================================================
    // CARGA DE MODELO — NOMBRES FLEXIBLES
    // ==========================================================
    const cargadorGLTF = new THREE.GLTFLoader();

    cargadorGLTF.load(
      'https://alan-nocturna.github.io/Bucal-personalizado/bucal.glb',
      (gltf) => {
        modelo = gltf.scene;
        escena.add(modelo);

        // Buscar mallas con distintos nombres posibles
        modelo.traverse((hijo) => {
          if (!hijo.isMesh) return;

          const nombre = (hijo.name || '').trim();
          const nombreMat = hijo.material ? (hijo.material.name || '').trim() : '';

          // Coincidencia flexible
          if (/exterior|afuera|cuerpo/i.test(nombre + ' ' + nombreMat)) {
            mallaExterior = hijo;
            hijo.material = matExterior;
          }
          if (/interior|adentro|canaleta/i.test(nombre + ' ' + nombreMat)) {
            mallaInterior = hijo;
            hijo.material = matInterior;
          }

          // Guardar la primera malla visible como base para el Decal
          if (!mallaPrincipal && hijo.visible) {
            mallaPrincipal = hijo;
          }
        });

        // Si no se encontró por nombre, usamos la primera malla
        if (!mallaExterior && mallaPrincipal) {
          mallaExterior = mallaPrincipal;
          mallaExterior.material = matExterior;
        }

        console.log('✅ Modelo cargado');
        console.log('🔵 Malla exterior:', mallaExterior?.name || '(detectada automáticamente)');
        console.log('⚫ Malla interior:', mallaInterior?.name || '(no detectada, se usará exterior)');

        estadoCarga.remove();
      },
      (progreso) => {
        const pct = progreso.total ? Math.round((progreso.loaded / progreso.total) * 100) : '...';
        estadoCarga.querySelector('span').textContent = `Cargando modelo... ${pct}%`;
      },
      (err) => {
        estadoCarga.querySelector('span').innerHTML = '❌ No se encontró <b>bucal.glb</b><br>Coloca el archivo en la misma carpeta que index.html';
        console.error('Error cargando modelo:', err);
      }
    );

    // ==========================================================
    // CONTROLES DE COLOR
    // ==========================================================
    document.getElementById('color-exterior').addEventListener('input', e => {
      matExterior.color.set(e.target.value);
    });
    document.getElementById('color-interior').addEventListener('input', e => {
      matInterior.color.set(e.target.value);
    });

    // ==========================================================
    // LOGO / DECAL
    // ==========================================================
    const entradaImagen = document.getElementById('entrada-imagen');
    const controlesLogo = document.getElementById('controles-logo');
    const btnQuitar = document.getElementById('btn-quitar');

    const config = { x: 0, y: 0, escala: 1, opacidad: 1, fusion: 'normal' };

    entradaImagen.addEventListener('change', e => {
      const arch = e.target.files[0];
      if (!arch) return;
      const lector = new FileReader();
      lector.onload = evt => {
        const img = new Image();
        img.onload = () => {
          if (texturaLogo) texturaLogo.dispose();
          texturaLogo = new THREE.Texture(img);
          texturaLogo.needsUpdate = true;
          controlesLogo.classList.remove('oculto');
          dibujarDecal();
        };
        img.src = evt.target.result;
      };
      lector.readAsDataURL(arch);
    });

    function dibujarDecal() {
      if (!mallaPrincipal || !texturaLogo) return;

      if (decal) {
        escena.remove(decal);
        decal.geometry?.dispose();
        decal.material?.dispose();
      }

      const matDecal = new THREE.MeshPhongMaterial({
        map: texturaLogo,
        transparent: true,
        opacity: config.opacidad,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -4,
        polygonOffsetUnits: -4
      });

      matDecal.blending = config.fusion === 'multiply'
        ? THREE.MultiplyBlending
        : THREE.NormalBlending;

      const imgRel = texturaLogo.image.width / Math.max(texturaLogo.image.height, 1);
      const ancho = 0.8 * config.escala * imgRel;
      const alto = 0.8 * config.escala;

      const pos = new THREE.Vector3(config.x, config.y, 1.2);
      const dir = new THREE.Vector3(0, 0, 1);
      const ori = new THREE.Euler(0, 0, 0);
      const tam = new THREE.Vector3(ancho, alto, 1);

      // ✅ DecalGeometry con nombre correcto para r128
      const geo = new THREE.DecalGeometry(mallaPrincipal, pos, dir, ori, tam);
      decal = new THREE.Mesh(geo, matDecal);
      escena.add(decal);
    }

    // Conectar sliders
    ['logo-x','logo-y','logo-escala','logo-opacidad','modo-fusion'].forEach(id => {
      document.getElementById(id).addEventListener('input', e => {
        const val = e.target.value;
        if (id === 'logo-x') config.x = +val;
        if (id === 'logo-y') config.y = +val;
        if (id === 'logo-escala') config.escala = +val;
        if (id === 'logo-opacidad') config.opacidad = +val;
        if (id === 'modo-fusion') config.fusion = val;
        dibujarDecal();
      });
    });

    btnQuitar.addEventListener('click', () => {
      if (decal) { escena.remove(decal); decal = null; }
      if (texturaLogo) { texturaLogo.dispose(); texturaLogo = null; }
      entradaImagen.value = '';
      controlesLogo.classList.add('oculto');
    });

    // ==========================================================
    // ANIMACIÓN
    // ==========================================================
    function bucle() {
      requestAnimationFrame(bucle);
      controles.update();
      renderer.render(escena, camara);
    }
    bucle();

    window.addEventListener('resize', () => {
      camara.aspect = contenedor.clientWidth / contenedor.clientHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(contenedor.clientWidth, contenedor.clientHeight);
    });
  </script>
</body>
  </html>
