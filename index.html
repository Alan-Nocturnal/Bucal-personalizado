<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Protector Bucal 3D Real</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0a0a0a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    #viewport {
      width: 100vw;
      height: 55vh;
      background: radial-gradient(circle at center, #222222 0%, #050505 100%);
      touch-action: none;
    }
    
    .panel {
      width: 100%;
      max-width: 380px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group {
      background: #181818;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #282828;
    }

    .group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 0.85rem; }

    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      width: 100%;
      font-size: 0.85rem;
    }

    .btn-dark { background: #262626; color: #ccc; }

    input[type="file"] { display: none; }
    .file-btn {
      display: block;
      background: #222;
      color: #eee;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      border: 1px dashed #444;
    }
  </style>
</head>
<body>

  <div id="viewport"></div>

  <div class="panel">
    <div class="group">
      <label>Colores del Bucal</label>
      <div class="row">
        <span>Carcasa / Pared Exterior (Azul en tu dibujo)</span>
        <input type="color" id="extColor" value="#0088ff">
      </div>
      <div class="row" style="margin-top: 6px;">
        <span>Canaleta Dientes (Rojo en tu dibujo)</span>
        <input type="color" id="intColor" value="#e50914">
      </div>
    </div>

    <div class="group">
      <label>Logo / Gráfico Frontal</label>
      <label for="imgInput" class="file-btn">📁 Subir Imagen (PNG/JPG)</label>
      <input type="file" id="imgInput" accept="image/*">
    </div>

    <div class="row">
      <button class="btn btn-dark" onclick="setView('front')">Frente</button>
      <button class="btn btn-dark" onclick="setView('top')">Ver Canaleta</button>
      <button class="btn btn-dark" onclick="setView('iso')">Perspectiva 3D</button>
    </div>

    <button class="btn" onclick="exportPNG()">💾 Guardar Imagen PNG</button>
  </div>

  <script>
    // 1. Escena
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación
    const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(5, 10, 7);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0xffffff, 0.6);
    light2.position.set(-5, 4, -5);
    scene.add(light2);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    // 2. Materiales
    const extMat = new THREE.MeshStandardMaterial({
      color: 0x0088ff,
      roughness: 0.25,
      metalness: 0.1
    });

    const intMat = new THREE.MeshStandardMaterial({
      color: 0xe50914,
      roughness: 0.3,
      metalness: 0.0
    });

    const mouthguardGroup = new THREE.Group();

    // 3. Creación precisa de la canaleta en "U" para los dientes superiores
    // Dibujamos el perfil del canal (Corte transversal)
    const profileShape = new THREE.Shape();
    // (x, y) donde y es la altura vertical del bucal
    profileShape.moveTo(0.0, 0.0);       // Base exterior del bucal
    profileShape.lineTo(0.2, 0.0);       // Borde inferior
    profileShape.lineTo(0.25, 0.2);      // Suelo del canal dental (ROJO)
    profileShape.lineTo(0.6, 0.2);       // Ancho donde se apoyan los dientes
    profileShape.lineTo(0.65, 0.8);      // Pared trasera (paladar)
    profileShape.lineTo(0.45, 0.8);      // Grosor pared trasera
    profileShape.lineTo(0.4, 0.35);      // Bajada interior del canal
    profileShape.lineTo(0.1, 0.35);      // Fondo del hueco
    profileShape.lineTo(-0.1, 1.3);      // Pared exterior frontal alta (AZUL - protege incisivos)
    profileShape.lineTo(-0.35, 1.2);     // Borde suave superior
    profileShape.closePath();

    // Curva del arco dentario humano (Forma de U visto desde arriba)
    const arcPath = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-2.5, 0, -1.2),
      new THREE.Vector3(-2.0, 0, 1.2),
      new THREE.Vector3(0, 0, 2.2),
      new THREE.Vector3(2.0, 0, 1.2),
      new THREE.Vector3(2.5, 0, -1.2)
    ]);

    const extrudeSettings = {
      steps: 80,
      bevelEnabled: true,
      bevelSegments: 3,
      bevelSize: 0.03,
      bevelThickness: 0.03,
      extrudePath: arcPath
    };

    // Generamos la carcasa exterior (AZUL)
    const extGeo = new THREE.ExtrudeGeometry(profileShape, extrudeSettings);
    extGeo.center();
    const outerMesh = new THREE.Mesh(extGeo, extMat);
    mouthguardGroup.add(outerMesh);

    // Generamos la canaleta interior ahuecada (ROJA)
    const intGeo = new THREE.ExtrudeGeometry(profileShape, extrudeSettings);
    intGeo.center();
    const innerMesh = new THREE.Mesh(intGeo, intMat);
    innerMesh.scale.set(0.98, 0.98, 0.98);
    innerMesh.position.y = 0.02; // Ligeramente desfasado para mostrar el recubrimiento
    mouthguardGroup.add(innerMesh);

    scene.add(mouthguardGroup);

    // 4. Carga e inserción de Logo en la cara exterior
    let logoMesh;
    document.getElementById('imgInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        new THREE.TextureLoader().load(event.target.result, (texture) => {
          if (!logoMesh) {
            const planeGeo = new THREE.PlaneGeometry(1.4, 0.7);
            const planeMat = new THREE.MeshBasicMaterial({
              map: texture,
              transparent: true,
              depthTest: true
            });
            logoMesh = new THREE.Mesh(planeGeo, planeMat);
            logoMesh.position.set(0, 0.1, 2.35); // Apoyado sobre la pared azul frontal
            mouthguardGroup.add(logoMesh);
          } else {
            logoMesh.material.map = texture;
            logoMesh.material.needsUpdate = true;
          }
          renderer.render(scene, camera);
        });
      };
      reader.readAsDataURL(file);
    });

    // 5. Ajustes de Color
    document.getElementById('extColor').addEventListener('input', (e) => {
      extMat.color.set(e.target.value);
    });

    document.getElementById('intColor').addEventListener('input', (e) => {
      intMat.color.set(e.target.value);
    });

    // 6. Vista y Cámara
    function setView(type) {
      if (type === 'front') {
        camera.position.set(0, 0.1, 6.0);
      } else if (type === 'top') {
        camera.position.set(0, 6.0, 0.1); // Muestra perfectamente la canaleta roja vacía para los dientes
      } else if (type === 'iso') {
        camera.position.set(3.5, 2.8, 4.5); // Vista inclinada exacta a tu dibujo
      }
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function exportPNG() {
      renderer.render(scene, camera);
      const dataURL = renderer.domElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'mi-bucal-3d.png';
      link.href = dataURL;
      link.click();
    }

    setView('iso');

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
